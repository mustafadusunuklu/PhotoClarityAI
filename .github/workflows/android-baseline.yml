name: Android platform and safety checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-03
        with:
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify Wrapper before executing it
        shell: bash
        run: |
          set -euo pipefail
          echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
          grep -Fx 'distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6' gradle/wrapper/gradle-wrapper.properties
          bash ./gradlew --version
      - name: Clean debug/test APKs, unsigned release, unit tests and lint
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' clean :app:assembleDebug :app:assembleDebugAndroidTest :app:bundleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease --console=plain
      - name: Require real tests (reject NO-SOURCE)
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert reports, 'No JVM test result XML; NO-SOURCE is not a baseline'
          roots = [ET.parse(p).getroot() for p in reports]
          count = sum(int(r.attrib['tests']) for r in roots)
          failures = sum(int(r.attrib.get('failures', 0)) + int(r.attrib.get('errors', 0)) + int(r.attrib.get('skipped', 0)) for r in roots)
          assert count >= 63, f'Expected platform and safety tests, found {count}'
          assert failures == 0, f'{failures} failed/error/skipped tests'
          print(f'{count} tests; zero failures/errors/skips')
      - name: Upload only build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseline-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-release.*
